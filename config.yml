    title: Sheetal Jadhav
    subtitle: "I am a neuroscientist-in-the-making with an Electronics Engineering background and hands-on experience across scales: from wet-lab developmental neurobiology and in vivo electrophysiology in songbirds to large-scale calcium imaging analysis and spiking network models of hippocampal learning. I build biologically grounded models of how plasticity shapes memory and behaviour, constrained by real neural data.\n\nOutside of research, I am an avid reader and writer. I am a self-taught photographer and an amateur Indian classical singer. Do check out my [writing wall](/books/) and [photography excursions](/photography/).\n\nIn a world where time is a social construct, I feel blissfully at peace sipping my chai while enjoying the sound of rain. Feel free to reach out to me in any way possible, I am always up for a conversation."
